services:
  openclaw-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        OPENCLAW_VERSION: ${OPENCLAW_VERSION:-latest}
        INSTALL_GEMINI_CLI: ${INSTALL_GEMINI_CLI:-true}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OPENCLAW_PORT:-18789}:${OPENCLAW_PORT:-18789}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config:/home/node/.openclaw
      - ./workspace:/home/node/workspace
      - ./extensions:/home/node/extensions:ro
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OLLAMA_HOST=host.docker.internal
      - OLLAMA_PORT=11434
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:${OPENCLAW_PORT:-18789}/", "-o", "/dev/null"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    # Security constraints
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=512m
      - /home/node/.npm:size=256m,uid=1000,gid=1000
      - /var/tmp:size=64m
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
