services:
  openclaw-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        OPENCLAW_VERSION: ${OPENCLAW_VERSION:-latest}
        INSTALL_GEMINI_CLI: ${INSTALL_GEMINI_CLI:-true}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OPENCLAW_PORT:-18789}:${OPENCLAW_PORT:-18789}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config:/home/node/.openclaw
      - ./workspace:/home/node/workspace
      - ./extensions:/home/node/extensions:ro
    # Secrets live in .runtime/openclaw.env (rendered by scripts/render-secrets-up.sh).
    # Loaded here instead of via `environment:` because compose's `environment:` takes
    # precedence over `env_file:` and would silently override loaded secrets with
    # empty strings if a key were declared with a `${VAR:-}` shell default.
    # `required: false` lets `docker compose config` and similar work on a fresh
    # checkout before the env file has been rendered.
    env_file:
      - path: .runtime/openclaw.env
        required: false
    environment:
      - OLLAMA_HOST=host.docker.internal
      - OLLAMA_PORT=11434
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:${OPENCLAW_PORT:-18789}/", "-o", "/dev/null"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    # Security constraints
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=512m
      - /home/node/.npm:size=256m,uid=1000,gid=1000
      - /var/tmp:size=64m
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
